<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to Trevor's Brave New Start</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <style>
    body { margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;
      background:linear-gradient(135deg, #ff9a9e, #fad0c4) no-repeat center/cover;
      font-family:'Montserrat',sans-serif; color:#fff; text-align:center;
    }
    h1 { font-size:2.5rem; margin-bottom:1rem; text-shadow:1px 1px 3px rgba(0,0,0,0.3); }
    #timer { font-size:4rem; letter-spacing:2px; margin-bottom:1rem; }
    #progress { width:80%; height:8px; background:rgba(255,255,255,0.3); border-radius:4px; overflow:hidden; margin-bottom:1.5rem; }
    #progress-bar { width:0%; height:100%; background:#fff; transition:width 1s linear; }
    #tip, #quote { max-width:80%; margin:0.5rem 0; background:rgba(255,255,255,0.2); padding:0.8rem 1rem; border-radius:6px; }
    .weather-container { display:flex; gap:1rem; margin:1rem 0; }
    .weather-box { background:rgba(255,255,255,0.2); padding:0.8rem; border-radius:6px; width:180px; }
    .weather-box h3 { margin:0 0 0.5rem; font-size:1rem; }
    .weather-box ul { list-style:none; padding:0; margin:0; font-size:0.85rem; color:#fff; }
    #message { display:none; font-size:1.5rem; margin-top:1rem; }
  </style>
</head>
<body>
  <h1>Trevor's Countdown</h1>
  <div id="timer">--:--:--:--</div>
  <div id="progress"><div id="progress-bar"></div></div>
  <div id="tip"></div>
  <div id="quote"></div>
  <div class="weather-container">
    <div class="weather-box"><h3>Beaumont, TX</h3><ul id="forecast-beaumont"><li>Loading...</li></ul></div>
    <div class="weather-box"><h3>Longview, TX</h3><ul id="forecast-longview"><li>Loading...</li></ul></div>
  </div>
  <div id="message">🎉 Trevor, welcome home! 🎉</div>

  <!-- Confetti & Audio Context -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
  <script>
    // AudioContext for ticking
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 440;
      osc.type = 'sine';
      gain.gain.value = 0.1;
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // Countdown logic
    const targetDate = new Date('2025-06-01T00:00:00');
    const loadTime = Date.now();
    const durationSec = (targetDate - loadTime) / 1000;

    const tips = [
      "Day 1: Inventory your belongings and decide what truly matters.",
      /* ... day 2–29 ... */
      "Day 30: Celebrate completing your move—treat yourself!"
    ];
    const quotes = [
      "“The secret of getting ahead is getting started.” — Mark Twain",
      /* ... day 2–29 ... */
      "“A journey of a thousand miles begins with a single step.” — Lao Tzu"
    ];

    function displayTip() {
      const idx = Math.floor((Date.now() - loadTime) / 86400000) % tips.length;
      document.getElementById('tip').textContent = `Tip: ${tips[idx]}`;
    }
    function displayQuote() {
      const idx = Math.floor((Date.now() - loadTime) / 86400000) % quotes.length;
      document.getElementById('quote').textContent = `Inspiration: ${quotes[idx]}`;
    }

    async function fetchRain(lat, lon, elem) {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=precipitation_probability_max&timezone=America%2FChicago`);
        const data = await res.json();
        const ul = document.getElementById(elem);
        ul.innerHTML = '';
        data.daily.time.forEach((d, i) => {
          const date = new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const p = data.daily.precipitation_probability_max[i];
          const icon = p > 50 ? '🌧️' : p > 0 ? '🌦️' : '☀️';
          const li = document.createElement('li');
          li.textContent = `${date}: ${icon} ${p}%`;
          ul.appendChild(li);
        });
      } catch {
        document.getElementById(elem).innerHTML = '<li>Error</li>';
      }
    }
    fetchRain(30.08, -94.10, 'forecast-beaumont');
    fetchRain(32.50, -94.73, 'forecast-longview');

    const timerEl = document.getElementById('timer');
    const progBar = document.getElementById('progress-bar');
    function update() {
      const now = Date.now();
      const diff = targetDate - now;
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      timerEl.textContent = `${String(d).padStart(2,'0')}:${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      progBar.style.width = `${((now - loadTime) / 1000 / durationSec) * 100}%`;
      beep();
      if (diff <= 0) celebrate();
    }

    function celebrate() {
      clearInterval(intervalId);
      document.getElementById('message').style.display = 'block';
      confetti({ particleCount: 200, spread: 100, origin: { x: 0.5, y: 0.5 } });
    }

    displayTip(); displayQuote();
    const intervalId = setInterval(update, 1000);
    update();
  </script>
</body>
</html>
